# テストを通してから GitHub Pages に公開する。
# 公開するのは game/ 全部と pixel/palette.json・pixel/sprites/*.json だけ
# （pixel/sprites/_original/・pixel/export/・pixel/editor.html は入れない）。
# 公開はリポジトリの既定のブランチに push したときと、手動で実行したときだけ。
# 古い実行をやり直しても古い版で上書きしないよう、既定のブランチの最新のコミットでなければ公開しない。
name: GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: テスト
        run: node --test "game/tests/*.test.js"
      - name: 問題の検査
        run: node tools/check-questions.mjs

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 最新のコミットか確かめる（古い実行のやり直しでは公開しない）
        id: latest
        run: |
          head=$(git ls-remote origin "refs/heads/${{ github.event.repository.default_branch }}" | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::このコミット（$GITHUB_SHA）は最新（$head）ではないので公開しません"
          fi
      - name: 公開するファイルを集める（フォルダの並びはリポジトリと同じ）
        if: steps.latest.outputs.ok == 'true'
        run: |
          v="${GITHUB_SHA::7}"
          mkdir -p _site/pixel/sprites
          cp -r game _site/game
          cp pixel/palette.json _site/pixel/
          cp pixel/sprites/*.json _site/pixel/sprites/
          # 版の番号を入れる。スクリプトとスタイルの URL に ?v=版 を付けて、ブラウザに残った古い版を使わせない
          sed -i "s|<meta name=\"app-version\" content=\"dev\">|<meta name=\"app-version\" content=\"$v\">|" _site/game/index.html
          sed -i -E "s#(src=\"js/main\.js)\"#\1?v=$v\"#; s#(href=\"css/style\.css)\"#\1?v=$v\"#" _site/game/index.html
          find _site/game/js -name '*.js' -exec sed -i -E "s#(from '\.{1,2}/[^']+\.js)'#\1?v=$v'#g" {} +
          echo "{\"version\":\"$v\"}" > _site/game/version.json
          grep -q "content=\"$v\"" _site/game/index.html
          grep -q "main.js?v=$v" _site/game/index.html
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=game/">
          <title>ドット絵勉強RPG（試作）</title>
          <a href="game/">ゲームへ</a>
          HTML
      - uses: actions/configure-pages@v5
        if: steps.latest.outputs.ok == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.latest.outputs.ok == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.latest.outputs.ok == 'true'
        uses: actions/deploy-pages@v4
