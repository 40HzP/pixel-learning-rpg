# テストを通してから GitHub Pages に公開する。
# 公開するのは game/ 全部と pixel/palette.json・pixel/sprites/*.json だけ
# （pixel/sprites/_original/・pixel/export/・pixel/editor.html は入れない）。
# 公開はリポジトリの既定のブランチに push したときと、手動で実行したときだけ。
# 使う前に、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく。
name: GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: テスト
        run: node --test "game/tests/*.test.js"
      - name: 問題の検査
        run: node tools/check-questions.mjs

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 公開するファイルを集める（フォルダの並びはリポジトリと同じ）
        run: |
          mkdir -p _site/pixel/sprites
          cp -r game _site/game
          cp pixel/palette.json _site/pixel/
          cp pixel/sprites/*.json _site/pixel/sprites/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=game/">
          <title>ドット絵勉強RPG（試作）</title>
          <a href="game/">ゲームへ</a>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
