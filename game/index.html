<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1626">
<meta name="app-version" content="dev"><!-- 公開するときに GitHub Actions がコミットの番号に書き換える -->
<title>ドット絵勉強RPG（試作）</title>
<link rel="icon" href="data:,">
<link rel="preload" href="fonts/DotGothic16-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="fonts/klee-one/klee-one.css"><!-- テストの用紙の字（教科書体に近い Klee One）。画面に出る文字の分だけ読み込む -->
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app">
  <main id="screens">
    <!-- 冒険 -->
    <section id="screen-adventure" class="screen">
      <div id="stage">
        <canvas id="scene" class="pixel" width="90" height="160"></canvas>
        <div id="hud"></div>
      </div>
    </section>

    <!-- 勉強 -->
    <section id="screen-study" class="screen" hidden>
      <div class="study-top">
        <div class="study-info" id="study-info"></div>
        <canvas id="mini" class="pixel" width="90" height="160" title="冒険の様子"></canvas>
      </div>
      <div id="study-body"></div>
    </section>

    <!-- 施設 -->
    <section id="screen-facility" class="screen" hidden></section>

    <!-- 図鑑 -->
    <section id="screen-zukan" class="screen" hidden></section>

    <!-- デバッグ（?debug=1 のときだけ） -->
    <section id="screen-debug" class="screen" hidden></section>
  </main>

  <!-- data-icon：ボタンに付けるアイコンのスプライト（pixel/sprites/<名前>.json。16×16） -->
  <nav id="tabs">
    <button data-tab="adventure" data-icon="icon_adventure" class="active"><span>冒険</span></button>
    <button data-tab="study" data-icon="icon_study"><span>勉強</span></button>
    <button data-tab="facility" data-icon="icon_town"><span>街</span></button>
    <button data-tab="zukan" data-icon="icon_zukan"><span>図鑑</span></button>
    <button data-tab="debug" hidden>デバッグ</button>
  </nav>

  <div id="notices" aria-live="polite"></div>
  <div id="update-bar" hidden>新しい版が公開されました<button id="update-reload" class="primary">読み込み直す</button></div>

  <div id="intro" class="overlay" hidden>
    <div class="dialog">
      <p class="intro-gen" id="intro-gen" hidden></p>
      <p class="intro-goal">最初の目的は、7歳で遭遇する<br>小学校教師をボコボコに倒すことだ。</p>
      <label class="intro-name">主人公の名前
        <input id="hero-name" type="text" maxlength="8" placeholder="主人公" autocomplete="off" enterkeyhint="done">
        <small>8文字まで。あとで街から変えられます</small>
      </label>
      <div class="intro-gender">性別
        <div class="intro-gender-choices" role="radiogroup" aria-label="性別">
          <button type="button" data-gender="male" role="radio" aria-checked="true" class="on">男の子</button>
          <button type="button" data-gender="female" role="radio" aria-checked="false">女の子</button>
        </div>
      </div>
      <div class="intro-choices">
        <button data-age="0" class="big">0歳から始める<small id="intro-age0-note">準備期間が長い</small></button>
        <button data-age="7" class="big">7歳から始める<small id="intro-age7-note">すぐ戦えるが弱い</small></button>
      </div>
    </div>
  </div>

  <div id="loading" class="overlay"><div class="dialog">読み込み中…</div></div>
</div>
</body>
</html>
